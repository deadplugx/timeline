name: timeline
description: "TimeLine is a Flutter package that provides a customizable timeline widget for displaying events in a chronological order. It allows developers to easily create visually appealing timelines with various customization options, such as colors, icons, and text styles. This package is ideal for applications that require a clear representation of events or milestones over time."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.1.2-alpha+2

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  fluttertoast: ^10.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400

    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
